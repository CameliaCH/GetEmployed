{% extends "base.html" %}

{% block title %}Sign In — GetEmployed{% endblock %}
{% block page_title %}Sign In{% endblock %}

{% block content %}
<div class="auth-container">

    <div id="register-box">
        <h2>Create Account</h2>
        <form method="POST">
            <input type="text"     name="name"     placeholder="Full Name" required>
            <input type="email"    name="email"    placeholder="Email"     required>
            <input type="password" name="password" placeholder="Password"  required>
            <button type="submit">Register</button>
        </form>
        <div class="toggle" onclick="toggleForms()">Already have an account? Sign in.</div>
    </div>

    <div id="login-box" style="display:none;">
        <h2>Sign In</h2>
        <form method="POST">
            <input type="email"    name="email"    placeholder="Email"    required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div class="toggle" onclick="toggleForms()">Don't have an account? Create one.</div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleForms() {
        const loginBox = document.getElementById("login-box");
        const regBox   = document.getElementById("register-box");
        const isLogin  = loginBox.style.display !== "none";
        loginBox.style.display = isLogin ? "none"  : "block";
        regBox.style.display   = isLogin ? "block" : "none";
    }
</script>
{% endblock %}
